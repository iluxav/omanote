<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Hyprland-style active border, in the colours of a synthwave sunset -->
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F08D"/>
      <stop offset="0.35" stop-color="#EE7A66"/>
      <stop offset="0.7" stop-color="#DD3F7B"/>
      <stop offset="1" stop-color="#5E4190"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1745"/>
      <stop offset="1" stop-color="#1B0B1C"/>
    </linearGradient>
    <linearGradient id="hash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F08D"/>
      <stop offset="1" stop-color="#EE7A66"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F08D"/>
      <stop offset="0.55" stop-color="#EE7A66"/>
      <stop offset="1" stop-color="#DD3F7B"/>
    </linearGradient>
    <clipPath id="inside"><rect x="28" y="28" width="456" height="456" rx="28"/></clipPath>
  </defs>

  <!-- the window -->
  <rect x="22" y="22" width="468" height="468" rx="34" fill="url(#tile)"/>

  <rect x="22" y="22" width="468" height="468" rx="34" fill="none" stroke="url(#border)" stroke-width="12"/>

  <!-- "# Heading": the markdown mark, drawn from bars so it needs no font -->
  <g fill="url(#hash)">
    <rect x="116" y="104" width="20" height="104" rx="6"/>
    <rect x="160" y="104" width="20" height="104" rx="6"/>
    <rect x="96" y="128" width="104" height="20" rx="6"/>
    <rect x="96" y="164" width="104" height="20" rx="6"/>
  </g>
  <rect x="232" y="132" width="184" height="30" rx="8" fill="#FBE3D2"/>
  <rect x="232" y="176" width="184" height="8" rx="4" fill="#EE7A66" opacity="0.7"/>

  <!-- a finished task: ticked box, dimmed and struck through -->
  <rect x="100" y="250" width="52" height="52" rx="10" fill="none" stroke="#EE7A66" stroke-width="10"/>
  <path d="M113 277 l11 12 l19 -24" fill="none" stroke="#EE7A66" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="184" y="264" width="200" height="24" rx="8" fill="#6B2A58"/>
  <rect x="172" y="273" width="224" height="6" rx="3" fill="#C9578A"/>

  <!-- the line being written, with the cursor -->
  <rect x="100" y="350" width="52" height="52" rx="10" fill="none" stroke="#DD3F7B" stroke-width="10"/>
  <rect x="184" y="364" width="128" height="24" rx="8" fill="#FBE3D2"/>
  <rect x="328" y="344" width="18" height="64" rx="5" fill="#F2F08D"/>
</svg>
