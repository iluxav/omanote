[package]
name = "omanote"
version = "0.0.15"
edition = "2024"
description = "An Obsidian-style markdown note editor for the terminal"
license = "MIT"
repository = "https://github.com/iluxav/omanote"

[dependencies]
ratatui = "0.30"
unicode-width = "0.2"
ureq = "2"
libc = "0.2"
portable-pty = "0.9"
vt100 = "0.15"
harper-core = { version = "2", default-features = false }
candle-core = "0.11"
candle-nn = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[profile.release]
opt-level = 3
lto = true
strip = true

# See vendor/vt100/PATCHED.md: one overflow fix the assistant pane's scrollback needs.
[patch.crates-io]
vt100 = { path = "vendor/vt100" }
